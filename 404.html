<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <title>404 — Page Not Found | Baxis Protocol</title>
  <meta name="title" content="404 — Page Not Found | Baxis Protocol">
  <meta name="description" content="The requested escrow vault or page link does not exist on Baxis Protocol. Return to your workspace or home page.">
  <meta name="robots" content="noindex, nofollow">

  <meta name="theme-color" content="#090909">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="images/baxis-logo.jpg">

  <!-- Typography: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-app: #090909;
      --bg-surface-0: #111111;
      --bg-surface-1: #161616;
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --text-muted: rgba(255, 255, 255, 0.42);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-default: rgba(255, 255, 255, 0.12);
      --state-error: #EF4444;
      --font-sans: "Inter", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --radius-md: 12px;
      --radius-xl: 24px;
      --radius-full: 9999px;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .site-header {
      border-bottom: 1px solid var(--border-subtle);
      height: 68px;
      display: flex;
      align-items: center;
      background-color: rgba(9, 9, 9, 0.85);
      backdrop-filter: blur(12px);
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-img {
      height: 28px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* 404 MAIN HERO */
    .error-hero-card {
      max-width: 620px;
      margin: 5rem auto;
      background-color: var(--bg-surface-0);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      padding: 3.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .error-code-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--state-error);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .error-title {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .error-desc {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 2.25rem;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 150ms ease;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--text-primary);
      color: var(--bg-app);
    }

    .btn-primary:hover {
      background-color: #E5E5E5;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: var(--bg-surface-1);
      color: var(--text-primary);
      border: 1px solid var(--border-default);
    }

    .btn-secondary:hover {
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    /* FOOTER */
    .site-footer {
      border-top: 1px solid var(--border-subtle);
      padding: 2rem 0;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    @media (max-width: 640px) {
      .error-hero-card { padding: 2.5rem 1.5rem; margin: 3rem auto; }
      .btn-group { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" aria-label="Baxis Homepage">
        <img src="images/baxis-logo.jpg" alt="Baxis Protocol Logo" class="logo-img" width="112" height="28">
      </a>
      <a href="auth.html" class="btn btn-secondary" style="padding: 0.5rem 1rem;">Launch Workspace</a>
    </div>
  </header>

  <!-- MAIN 404 CONTENT -->
  <main class="container">
    <div class="error-hero-card">
      <span class="error-code-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        404 ERROR
      </span>

      <h1 class="error-title">Page Not Found.</h1>

      <p class="error-desc">
        The requested link may have expired, contained a typo, or the escrow vault ID does not exist in our database.
      </p>

      <div class="btn-group">
        <a href="auth.html" class="btn btn-primary">Go to Workspace</a>
        <a href="index.html" class="btn btn-secondary">Return Homepage</a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>&copy; 2026 Baxis Protocol. All rights reserved.</span>
      <a href="docs.html" style="color: var(--text-secondary);">Need help? Check Documentation</a>
    </div>
  </footer>

</body>
</html>
